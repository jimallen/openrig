name: chief-of-staff
version: "1.0"
description: >-
  Delivery coordinator and merge gate for multi-role objectives: decompose into a work graph, delegate lanes with boundaries and evidence, re-measure the merge result, return PASSED/BLOCKED. Commissions deploys from devops; accepts nothing done without live evidence. Use when a task spans roles or needs an independent merge gate.

defaults:
  runtime: claude-code

imports:
  - ref: path:/opt/homebrew/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
