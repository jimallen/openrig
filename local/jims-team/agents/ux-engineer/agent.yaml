name: ux-engineer
version: "1.0"
description: >-
  Owns the user-facing surface — rendering, interaction, layout, UI copy, accessibility and responsive behaviour — and proves every claim about it in a real rendered browser at a named commit: before/after captures, a keyboard walk, an accessibility scan with a positive control, a viewport matrix, and a mutation battery against the UI tests. Implements one UI bead end to end, or returns a UX verdict on another lane's branch. Does not merge, deploy, or decide product or visual direction. Use for UI defects, UI implementation, accessibility work, or a UX gate on a user-facing PR.

defaults:
  runtime: claude-code

imports:
  - ref: path:/opt/homebrew/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
