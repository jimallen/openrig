# Defect class: the one-view-state invariant (PIN-1) as a standing machine-checked
#   assertion — tui_socket == ps == queue must express the SAME truth.
# Marathon origin: the TUI socket state, `rig ps`, and `rig queue` drifted out of sync
#   after a burst of activity, so three surfaces told three stories of one system.
# SEED (class: view-state-divergence): the seeded regression makes one surface
#   (tui_socket) lag/omit after the storm. The `equals` cross-surface leg MUST catch it
#   — the diff shows the normalized surfaces disagreeing.
#
# workspaces-o9o.132 (ROUTING R-13, converted): `equals` is the DECLARATIVE mapping of surface -> projection,
# the only form the validator accepts, as in test/fixtures/scenarios/scenario-10-one-view-state.yaml. `ps` and
# `queue` are the daemon-truth surfaces, compared by the rig set each names; the queue gets one real item
# (env.queue) so that comparison cannot pass empty. tui_socket is asserted on its own: its OBSERVE verbs
# return UI/registry state, not daemon truth, so folding it into the equality could only pass trivially.
# Storm = an explicit bounded sequence (no loop verb). Its `mutate` steps have no host binding at v1, so in
# host mode the scenario is reported NOT RUN at step 3 until they are bound.
scenario: one-view-state-after-mutation-storm
topology: ./mutation-pod-stub.yaml
env:
  # D7 (51-02 delta): tui_socket expects require the TUI opt-in — the pipeline
  # provisions the shipped TUI (isolated tmux server + scaffold socket) only when
  # declared, so the surface read never races a socket that never listens.
  tui: true
  # one real queue item, so ps and queue each name a rig to agree about
  queue:
    - id: storm-1
      source: harness@mutation-pod-stub
      destination: swarm-a@mutation-pod-stub
      summary: "one-view-state after the storm: the queue's rig must be a rig ps knows"
      claim: true
steps:
  - up: {}
  # Bounded mutation storm: interleave sends and structural edits.
  - send: {to: swarm-a@mutation-pod-stub, text: "task 1"}
  - send: {to: swarm-b@mutation-pod-stub, text: "task 2"}
  - mutate: {op: add_member, pod: swarm, member: d, runtime: stub}
  - send: {to: swarm-c@mutation-pod-stub, text: "task 3"}
  - mutate: {op: rename_member, pod: swarm, from: d, to: e}
  - send: {to: swarm-e@mutation-pod-stub, text: "task 4"}
  # After the storm the TUI is live and coherent (its own state)...
  - expect:
      surface: tui_socket
      within: 30s
      match:
        ok: true
  # ...and ps and queue name the same rig set (normalized cross-surface equality).
  - expect:
      surface: ps
      within: 30s
      equals:
        ps: { pluck: name }
        queue: { pluck: destinationSession, rig: true }
  - seed_regression: {class: view-state-divergence}
  - down: {}
