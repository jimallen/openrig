# Defect class: the one-view-state invariant (PIN-1): after a burst of activity, `ps`, `queue` and the TUI
#   must name the same world.
# Marathon origin: the TUI socket state, `rig ps`, and `rig queue` drifted out of sync after a burst of
#   activity, so three surfaces told three stories of one system.
#
# WHAT THIS PROVES (workspaces-o9o.132; TUI view workspaces-o9o.172): after the storm, `ps`, `queue` and the
#   TUI's own view of the world agree (the declarative `equals`, ROUTING R-13): `ps` and `queue` name the same
#   rig set, with one real queue item (env.queue) so the comparison cannot pass empty, and `ps` and the TUI
#   name the same rigs with the same agent count each (a `join` of name and count). The TUI's view is its
#   socket's OBSERVE verb `view` (the `tui_view` surface; R-21), and it counts only when FRESH: settled, not
#   stale, and confirmed during the step (its readAt at or after the step's start; the TUI and the runner
#   read one wall clock on one host). The `tui_socket` leg asserts the TUI is live on the topology screen.
#   The TUI reads a rig's seats only once that rig is selected (measured on a real TUI: on its landing page the
#   rig sat in the view with no seats read), so the `tui` action first drills it into the rig with its own
#   `rig <name>` command; until the seats are read the view's agentCount is null, which no ps count equals.
#
# SEED (class: queue-rig-divergence): the seeded run plants, AFTER the storm and BEFORE the assertions, a
#   queue item addressed to a rig `ps` does not run (the queue telling a story `ps` cannot see). The `equals`
#   leg MUST then fail: the normalized rig sets differ. Pinned with this file's own steps and the real runner
#   core and normalizer by test/scenario-one-view-state-library.test.ts (healthy PASS, seeded FAIL at the
#   equality, a TUI missing the rig FAIL at the equality). Host mode arms no seed and does not bind `mutate`, so here the
#   scenario is reported NOT RUN at its first `mutate`.
#
scenario: one-view-state-after-mutation-storm
topology: ./mutation-pod-stub.yaml
env:
  # D7 (51-02 delta): tui_socket expects require the TUI opt-in — the pipeline
  # provisions the shipped TUI (isolated tmux server + scaffold socket) only when
  # declared, so the surface read never races a socket that never listens.
  tui: true
  # one real queue item, so ps and queue each name a rig to agree about
  queue:
    - id: storm-1
      source: harness@mutation-pod-stub
      destination: swarm-a@mutation-pod-stub
      summary: "one-view-state after the storm: the queue's rig must be a rig ps knows"
      claim: true
steps:
  - up: {}
  # Bounded mutation storm: interleave sends and structural edits.
  - send: {to: swarm-a@mutation-pod-stub, text: "task 1"}
  - send: {to: swarm-b@mutation-pod-stub, text: "task 2"}
  - mutate: {op: add_member, pod: swarm, member: d, runtime: stub}
  - send: {to: swarm-c@mutation-pod-stub, text: "task 3"}
  - mutate: {op: rename_member, pod: swarm, from: d, to: e}
  - send: {to: swarm-e@mutation-pod-stub, text: "task 4"}
  # The seed is armed BEFORE the assertion it must break (workspaces-o9o.132 review): a seeded run plants the
  # queue-rig divergence here, after the storm, and the `equals` leg below must catch it.
  - seed_regression: {class: queue-rig-divergence}
  # The TUI is live on the topology screen (its own state; its view of the world is the tui_view legs below).
  - expect:
      surface: tui_socket
      within: 30s
      match:
        ok: true
        state:
          screen: topology
          address:
            section: topology
  # Drill the TUI into the rig, so it reads the rig's seats (the one `rig <name>` line to the TUI socket, never the daemon).
  - tui: {rig: mutation-pod-stub}
  # The TUI's view counts only when it is fresh: settled, not stale, and confirmed during this step (its readAt at or after the step's
  # start; the TUI and the runner read one wall clock on one host).
  - expect:
      surface: tui_view
      within: 30s
      match:
        ok: true
        view:
          settled: true
          stale: false
          confirmedDuringStep: true
  # ps and queue name the same rig set (normalized cross-surface equality)...
  - expect:
      surface: ps
      within: 30s
      equals:
        ps: { pluck: name }
        queue: { pluck: destinationSession, rig: true }
  # ...and ps and the TUI name the same rigs with the same number of agents each (an unread rig's agentCount is null, never equal).
  - expect:
      surface: ps
      within: 30s
      equals:
        ps: { join: [name, nodeCount] }
        tui_view: { path: view.rigs, join: [name, agentCount] }
  - down: {}
